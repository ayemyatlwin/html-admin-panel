<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Permissions</title>
  <link rel="icon" href="favicon.ico"><link href="style.css" rel="stylesheet"></head>
  <style></style>
  <body>
    <div class="mx-auto max-w-2xl rounded-lg bg-white p-6 shadow">
      <h2 class="mb-4 text-lg font-semibold">Menu Permissions</h2>
      <div>
        <!-- Settings -->
        <div class="mb-4">
          <h3 class="font-medium">Settings</h3>
          <div class="mt-2 flex items-center space-x-4">
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Edit
            </label>
          </div>
        </div>

        <!-- Members -->
        <div class="mb-4">
          <h3 class="font-medium">Members</h3>
          <div class="mt-2 flex items-center space-x-4">
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Read
            </label>
          </div>
        </div>

        <!-- Users -->
        <div class="mb-4">
          <h3 class="font-medium">Users</h3>
          <div class="mt-2 flex items-center space-x-4">
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Read
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Create
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Edit
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Delete
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Trash
            </label>
          </div>
        </div>

        <!-- Roles -->
        <div class="mb-4">
          <h3 class="font-medium">Roles</h3>
          <div class="mt-2 flex items-center space-x-4">
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Read
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Create
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Edit
            </label>
          </div>
        </div>

        <!-- News -->
        <div class="mb-4">
          <h3 class="font-medium">News</h3>
          <div class="mt-2 flex items-center space-x-4">
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" checked /> Read
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Create
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" checked /> Edit
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Delete
            </label>
            <label class="flex items-center">
              <input type="checkbox" class="mr-2" /> Trash
            </label>
          </div>
        </div>

        <!-- Repeat similar blocks for FAQs Category, FAQs, Events, Campaigns -->
      </div>
    </div>
  <script defer src="bundle.js"></script></body>
</html>
