        padding: 1rem;
        background-color: #fff;

      .tab-content {

      }
      .tab-content.active {

            <script type="text/javascript">
              document.addEventListener("DOMContentLoaded", function () {
                const readCheckboxes = document.querySelectorAll(
                  'input[data-action="check-all"]'
                );

                readCheckboxes.forEach((checkbox) => {
                  checkbox.addEventListener("click", function () {
                    const liElement = this.closest("li");
                    const checkboxes = liElement.querySelectorAll(
                      'input[type="checkbox"]'
                    );
                    checkboxes.forEach((cb) => {
                      cb.checked = this.checked;
                    });
                  });
                });
                const tabs = document.querySelectorAll(".tab-label");
                const contents = document.querySelectorAll(".tab-content");

                tabs.forEach((tab) => {
                  tab.addEventListener("click", () => {
                    // remove initial active classlist
                    tabs.forEach((tabb) => tabb.classList.remove("active"));
                    contents.forEach((content) =>
                      content.classList.remove("active")
                    );

                    // add active classlist After click

                    tab.classList.add("active");
                    const target = tab.getAttribute("data-target");
                    document.getElementById(target).classList.add("active");
                  });
                });
              });
            </script>
