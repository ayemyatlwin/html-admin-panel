<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Tab Permission</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
      }

      .tab-container {
        display: flex;
        width: 100%;
      }

      .sidebar {
        width: 20%;
        background-color: #fff;
        border-right: 1px solid #ddd;
        padding: 1rem;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }
      .tab-label {
        margin-bottom: 1rem;
        font-size: 1rem;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        color: #333;
      }

      .tab-label.active {
        background-color: #e7f3ff;
        color: #007bff;
        font-weight: bold;
      }

      .content {
        width: 80%;
        padding: 1rem;
        background-color: #fff;
        overflow-y: auto;
      }

      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }
    </style>
  </head>

    <div class="tab-container">
      <div class="sidebar">
        <div class="tab-label active" data-target="settings-tab">Settings</div>
        <div class="tab-label" data-target="members-tab">Members</div>
        <div class="tab-label" data-target="users-tab">Users</div>
        <div class="tab-label" data-target="roles-tab">Roles</div>

    </div>

    <!-- </div> -->
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", function () {
        const readCheckboxes = document.querySelectorAll(
          'input[data-action="check-all"]'
        );

        readCheckboxes.forEach((checkbox) => {
          checkbox.addEventListener("click", function () {
            const liElement = this.closest("li");
            const checkboxes = liElement.querySelectorAll(
              'input[type="checkbox"]'
            );
            checkboxes.forEach((cb) => {
              cb.checked = this.checked;
            });
          });
        });
        const tabs = document.querySelectorAll(".tab-label");
        const contents = document.querySelectorAll(".tab-content");

        tabs.forEach((tab) => {
          tab.addEventListener("click", () => {
            // remove initial active classlist
            tabs.forEach((tabb) => tabb.classList.remove("active"));
            contents.forEach((content) => content.classList.add("active"));

            // add active classlist After click

            tab.classList.add("active");
            const target = tab.getAttribute("data-target");
            document.getElementById(target).classList.add("active");
          });
        });
      });
    </script>
  </body>
</html>
